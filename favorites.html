<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorites - Absolute Cinema</title>

    <link rel="stylesheet" href="favorites.css">
</head>

<body>

    <!-- =========================
         Navigation Bar
    ========================== -->

    <header>
        <nav class="navbar">

            <div class="nav-container">

                <h1 class="logo">Absolute Cinema</h1>

                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="favorites.html">Favorites</a>
                </div>

                <!-- Visible on smaller screens -->
                <button class="menu-btn" aria-label="Open navigation menu">
                    ☰
                </button>

            </div>

        </nav>
    </header>


    <!-- =========================
         Main Content
    ========================== -->

    <main>

        <div class="favorites-container">

            <h2>Favorites</h2>


            <!-- Shown when there are no saved favorites -->

            <div class="empty-favorites">

                <div class="empty-favorites-icon">
                    ♥
                </div>

                <h3>No Favorites Yet</h3>

                <p>
                    Movies you add to your favorites will appear here.
                </p>

            </div>


            <!-- JavaScript inserts favorite movie cards here -->

            <div class="movie-grid"></div>

        </div>

    </main>


    <!-- =========================
         Footer
    ========================== -->

    <footer>
        <p>© 2026 Absolute Cinema</p>

        <div class="credits">
            <h3>Credits</h3>

            <img src="assets/tmdb-logo.svg" alt="TMDB Logo">

            <p>
                This product uses the TMDB API but is not endorsed or certified by TMDB.
            </p>

            <a href="https://www.themoviedb.org/" target="_blank">
                TMDB
            </a>
        </div>
    </footer>


    <!-- JavaScript -->
    <script src="favorites.js"></script>

</body>

</html>
